<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Капиbbbара</title>
    <link rel="icon" type="image/x-icon" href="/static/capibara_transparent.svg">
    <link rel="stylesheet" href="/static/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container-wrapper">
        <div class="container">
            <div id="title">
                <span><img class="logo" id="logo" src="/static/capibbbara.png"></span>
                <span class="logo_text">
                    <span class="logo_k"><b>К</b></span>
                    <b>апи</b>
                    <span class="logo_bbb"><i><b>bbb</b></i></span>
                    <b>ара</b>
                </span>
            </div>
            <div class="search-box">
                <input type="text" id="urlInput" placeholder="https://bbb.ssau.ru/b/xxx-xxx-xxx">
                <button id="searchButton">Найти комнату лекции</button>
            </div>
            <div id="response"></div>
        </div>
    </div>
    <div class="lections_container">
        <section id="tableSection" class="hidden"></section>
    </div>
    <div class="overlay" id="overlay" style="display: none;">
        <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; height: 100vh;">
            <div style="font-size: 64px; margin-bottom: 20px; animation: bounce 1s infinite;">
                🐾
            </div>
            <span style="font-size: 24px; color: #333; font-weight: bold; animation: pulse 2s infinite;">
                Капибарсим...
            </span>
        </div>
    </div>
    <script src="/static/index.js"></script>
</body>
</html>
